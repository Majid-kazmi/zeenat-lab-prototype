<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A2557">
<title>Zeenat Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=block">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<style>
  .splash {
    min-height: 100dvh;
    background: radial-gradient(120% 80% at 50% 0%, var(--navy-700), var(--navy-900) 70%);
    color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: var(--s10) var(--gutter) calc(var(--s10) + var(--safe-bottom));
    position: relative; overflow: hidden; cursor: pointer;
  }
  .splash__ring {
    position: absolute; top: 50%; left: 50%;
    width: 220px; height: 220px; margin: -150px 0 0 -110px;
    border-radius: 50%; border: 1px solid rgba(255,255,255,.14);
    animation: ripple 2.4s var(--ease-out) infinite;
  }
  .splash__ring:nth-child(2) { animation-delay: .8s; }
  .splash__mark {
    width: 88px; height: 88px; border-radius: 26px;
    background: #fff; display: grid; place-items: center;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.5);
    animation: mark-in .9s var(--ease-spring) both;
    position: relative; z-index: 1;
  }
  .splash__mark svg { width: 46px; height: 46px; }
  .splash__drop { fill: var(--navy-800); transform-origin: 50% 70%; animation: drop .8s var(--ease-spring) .35s both; }
  .splash__dot { fill: var(--lime-500); transform-origin: center; transform-box: fill-box; animation: pop-in .5s var(--ease-spring) .75s both; }
  .splash h1 { font-size: 26px; font-weight: 700; letter-spacing: -.025em; margin-top: var(--s6); animation: fade-up .7s var(--ease-out) .55s both; }
  .splash p  { font-size: 14px; color: rgba(255,255,255,.62); margin-top: 6px; animation: fade-up .7s var(--ease-out) .7s both; }
  .splash__bar {
    position: absolute; bottom: calc(56px + var(--safe-bottom));
    width: 64px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden;
    animation: fade-in .4s ease 1s both;
  }
  .splash__bar::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; background: #fff;
    transform-origin: left; animation: grow-x 1.4s var(--ease-out) 1s both;
  }
  @keyframes ripple { from { transform: scale(.6); opacity: .9; } to { transform: scale(2); opacity: 0; } }
  @keyframes mark-in { from { opacity: 0; transform: scale(.5) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes drop { from { transform: translateY(-14px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<main class="app">
  <a class="splash" href="02-login.html" aria-label="Continue">
    <span class="splash__ring" aria-hidden="true"></span>
    <span class="splash__ring" aria-hidden="true"></span>
    <span class="splash__mark" aria-hidden="true">
      <svg viewBox="0 0 48 48"><path class="splash__drop" d="M24 6c6.5 8.5 11 14.5 11 20a11 11 0 0 1-22 0c0-5.5 4.5-11.5 11-20Z"/><circle class="splash__dot" cx="36" cy="37" r="5"/></svg>
    </span>
    <h1>Zeenat Lab</h1>
    <p>Lab tests, at home</p>
    <span class="splash__bar" aria-hidden="true"></span>
  </a>
</main>
<script>
  // Hand off to login once the intro finishes (tap anywhere to skip).
  setTimeout(() => location.replace("02-login.html"), 2600);
</script>
</body>
</html>
