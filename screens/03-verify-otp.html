<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F7FB">
<title>Verify · Zeenat Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400..500,0..1,0&display=block">
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components.css">
<script src="../scripts/app.js" defer></script>
<style>
  .otp { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); }
  .otp input {
    width: 100%; min-width: 0;
    height: 64px; border-radius: var(--r-md); text-align: center;
    font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--surface); border: 1.5px solid var(--line-2); outline: none; caret-color: var(--blue-600);
    transition: border-color var(--t-fast), box-shadow var(--t-med), transform var(--t-med) var(--ease-spring);
  }
  .otp input:focus { border-color: var(--blue-600); box-shadow: var(--focus-ring); }
  .otp input.is-filled { transform: translateY(-2px); border-color: var(--ink); }
  .otp.is-ok input { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
  .otp.is-error { animation: shake .4s; }
  .otp.is-error input { border-color: var(--alert); }
  .spinner { width: 20px; height: 20px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="icon-btn" href="02-login.html" aria-label="Back"><span class="icon">arrow_back</span></a>
      <div class="topbar__title"></div>
      <span class="topbar__spacer"></span>
    </div>
  </header>

  <div class="page page--plain" data-stagger>
    <div class="stack-sm">
      <h1 class="t-title">Enter the code</h1>
      <p class="t-muted">Sent to <strong class="t-strong" style="color:var(--ink)">+92 <span id="phone">300 1234567</span></strong> · <a class="link" href="02-login.html">Change</a></p>
    </div>

    <div class="otp" id="otp" role="group" aria-label="4-digit code">
      <input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
      <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
    </div>

    <p class="t-sm t-muted center" id="resend-wrap">Resend code in <span class="num t-strong" id="timer">0:30</span></p>

    <button class="btn btn--primary btn--block" id="verify" aria-disabled="true">Verify</button>
    <p class="t-xs t-faint center">Prototype: any 4 digits will work.</p>
  </div>
</main>
<script>
  const box = document.getElementById("otp");
  const inputs = [...box.querySelectorAll("input")];
  const verify = document.getElementById("verify");
  const savedPhone = (() => { try { return JSON.parse(localStorage.getItem("zl.phone")); } catch { return null; } })();
  if (savedPhone) document.getElementById("phone").textContent = savedPhone;

  const code = () => inputs.map((i) => i.value).join("");
  const sync = () => {
    inputs.forEach((i) => i.classList.toggle("is-filled", !!i.value));
    verify.setAttribute("aria-disabled", code().length < 4);
    if (code().length === 4) submit();
  };

  inputs.forEach((input, idx) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(-1);
      if (input.value && idx < 3) inputs[idx + 1].focus();
      sync();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && idx > 0) inputs[idx - 1].focus();
    });
    input.addEventListener("paste", (e) => {
      const d = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 4);
      if (!d) return;
      e.preventDefault();
      d.split("").forEach((c, i) => (inputs[i].value = c));
      inputs[Math.min(d.length, 3)].focus();
      sync();
    });
  });
  setTimeout(() => inputs[0].focus(), 350);

  let busy = false;
  function submit() {
    if (busy) return; busy = true;
    verify.innerHTML = '<span class="spinner"></span>';
    setTimeout(() => {
      box.classList.add("is-ok");
      verify.innerHTML = '<span class="icon">check</span>Verified';
      setTimeout(() => location.replace("10-home.html"), 500);
    }, 700);
  }
  verify.addEventListener("click", () => { if (code().length === 4) submit(); else { box.classList.remove("is-error"); void box.offsetWidth; box.classList.add("is-error"); } });

  // Resend countdown
  let left = 30;
  const wrap = document.getElementById("resend-wrap");
  const tick = setInterval(() => {
    left--;
    if (left > 0) { document.getElementById("timer").textContent = "0:" + String(left).padStart(2, "0"); return; }
    clearInterval(tick);
    wrap.innerHTML = 'Didn’t get it? <button class="link" type="button" data-toast="New code sent" data-toast-icon="sms">Resend code</button>';
  }, 1000);
</script>
</body>
</html>
